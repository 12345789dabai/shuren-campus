<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>树人校园数字孪生系统</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!-- 加载画面 -->
  <div id="loading-screen">
    <div class="loading-content">
      <div class="loading-icon">🏛</div>
      <h2>树人校园 · 数字孪生</h2>
      <div class="loading-bar"><div class="loading-bar-fill"></div></div>
      <p class="loading-text">正在构建三维场景...</p>
    </div>
  </div>

  <div id="container"></div>

  <!-- 顶部标题栏 -->
  <div id="header">
    <div class="header-badge">
      <span class="dot-pulse"></span>
      实时渲染
    </div>
    <h1>树人校园 · 数字孪生</h1>
    <p class="header-sub">SHUREN CAMPUS DIGITAL TWIN</p>
  </div>

  <!-- FPS -->
  <div id="fps-display">
    <span class="fps-label">FPS</span>
    <span class="fps-value">0</span>
  </div>

  <!-- 操作提示 -->
  <div id="hint">
    <span class="hint-icon">⌨</span>
    左键旋转 · 滚轮缩放 · 右键平移 · 点击建筑查看详情
  </div>

  <!-- 控制面板 -->
  <div id="control-panel">
    <div class="panel-header">
      <span class="panel-icon">◈</span>
      控制系统
      <span class="panel-line"></span>
    </div>

    <div class="panel-section">
      <div class="panel-title">视角切换</div>
      <div class="btn-group">
        <button class="btn active" data-view="perspective">🌐 透视</button>
        <button class="btn" data-view="birdseye">🛰 鸟瞰</button>
        <button class="btn" data-view="library">📚 图书馆</button>
        <button class="btn" data-view="gate">🚪 校门</button>
      </div>
    </div>

    <div class="panel-divider"></div>

    <div class="panel-section">
      <div class="panel-title">图层控制</div>
      <label class="layer-toggle"><input type="checkbox" checked data-layer="buildings" /> <span>建筑</span></label>
      <label class="layer-toggle"><input type="checkbox" checked data-layer="roads" /> <span>道路</span></label>
      <label class="layer-toggle"><input type="checkbox" checked data-layer="vegetation" /> <span>植被</span></label>
    </div>

    <div class="panel-divider"></div>

    <div class="panel-section">
      <div class="panel-title">自动漫游</div>
      <button class="btn roam-btn" id="roam-toggle">▶ 开始漫游</button>
      <div class="speed-control">
        <span class="speed-label">慢</span>
        <input type="range" id="roam-speed" min="1" max="10" value="5" />
        <span class="speed-label">快</span>
      </div>
    </div>

    <div class="panel-divider"></div>

    <div class="panel-section">
      <div class="panel-title">环境</div>
      <button class="btn env-btn" id="daynight-toggle">🌙 切换夜晚</button>
    </div>
  </div>

  <!-- 信息弹窗 -->
  <div id="info-modal" class="hidden">
    <div id="modal-overlay"></div>
    <div id="modal-content">
      <button id="modal-close">&times;</button>
      <div class="modal-image">
        <div class="modal-image-placeholder">
          <span class="building-icon">🏛</span>
        </div>
      </div>
      <div class="modal-body">
        <div class="modal-tag">校园建筑</div>
        <h2 id="modal-title"></h2>
        <div class="modal-divider"></div>
        <p id="modal-desc"></p>
        <div class="modal-specs">
          <div class="spec-item">
            <span class="spec-label">层数</span>
            <span class="spec-value" id="modal-floors"></span>
          </div>
          <div class="spec-item">
            <span class="spec-label">面积</span>
            <span class="spec-value" id="modal-area"></span>
          </div>
          <div class="spec-item">
            <span class="spec-label">用途</span>
            <span class="spec-value" id="modal-usage"></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
